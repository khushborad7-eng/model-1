<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Silver Oak University</title>
    <!-- Bootstrap 3.4.1 CSS CDN for carousel compatibility -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <!-- Added Font Awesome and Google Fonts for attractive navbar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&display=swap" rel="stylesheet">

    <style>
      body {
        background-color: #fff;
        color: #000;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font-family: 'Roboto', Arial, sans-serif;
      }
      main {
        flex: 1 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 0;
        width: 100vw;
        overflow: hidden;
        position: relative;
      }
      .registration-row {
        margin-top: 48px;
        margin-bottom: 48px;
        width: 100%;
      }
      /* === Attractive Navbar Custom Styles (from home.html) === */
      .navbar.custom-navbar {
        background: linear-gradient(90deg, #4731d3 0%, #00c6ff 100%);
        border: none;
        padding: 0;
        box-shadow: 0 4px 24px rgba(36, 37, 38, 0.09);
        min-height: 68px;
      }
      .navbar.custom-navbar .navbar-header .navbar-brand {
        font-family: 'Roboto', Arial, sans-serif;
        font-weight: 700;
        color: #fff !important;
        font-size: 2rem;
        letter-spacing: 2px;
        text-shadow: 0 2px 8px rgba(0,0,0,0.12);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .navbar.custom-navbar .navbar-brand i {
        color: #ffe773;
      }
      .navbar.custom-navbar .nav > li > a {
        color: #fff !important;
        text-transform: uppercase;
        font-weight: 500;
        letter-spacing: 1.5px;
        transition: background 0.26s, color 0.14s;
        font-size: 1.1rem;
        border-radius: 22px;
        margin: 0 6px;
        padding: 12px 18px !important;
        position: relative;
      }
      .navbar.custom-navbar .nav > li.active > a,
      .navbar.custom-navbar .nav > li > a:hover,
      .navbar.custom-navbar .nav > li > a:focus {
        color: #373737 !important;
        background: rgba(255,255,255,0.90) !important;
        box-shadow: 0 2px 24px rgba(0,0,0,0.06);
        text-shadow: none;
      }
      .navbar.custom-navbar .navbar-toggle {
        border-color: #fff !important;
        background: rgba(255,255,255,0.2);
      }
      .navbar.custom-navbar .icon-bar {
        background-color: #fff !important;
      }
      @media (max-width: 767px) {
        .navbar.custom-navbar .navbar-header .navbar-brand {
          font-size: 1.3rem;
          gap: 5px;
        }
        .navbar.custom-navbar .nav > li > a {
          font-size: 1rem;
          text-align: left;
        }
      }
      /* End of navbar styles */
      .footer {
        background: #000;
        color: #fff;
        width: 100%;
        text-align: center;
        padding: 15px 0;
        margin-bottom: 0;
        border-radius: 0;
      }
    </style>
    <!-- Bootstrap 3 Carousel dependencies -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
  <!-- More Attractive Bootstrap Navbar (Header) from home.html -->
  <nav class="navbar navbar-inverse navbar-static-top custom-navbar">
    <div class="container-fluid">
      <div class="navbar-header">
        <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>
        <a class="navbar-brand" href="home.html">
          <i class="fas fa-graduation-cap"></i> Home
        </a>
      </div>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="nav navbar-nav navbar-right">
          <li class="active"><a href="registration.html"><i class="fa fa-user-plus"></i> Registration</a></li>
          <li><a href="login.html"><i class="fa fa-sign-in-alt"></i> Login</a></li>
          <li><a href="gallery.html"><i class="fa fa-images"></i> Gallery</a></li>
          <li><a href="contactus.html"><i class="fa fa-envelope"></i> Contact Us</a></li>
          <li><a href="flexbox.html"><i class="fa fa-th-large"></i> Flexbox</a></li>

        </ul>
      </div>
    </div>
  </nav>
  <main>
    <div class="container">
      <div class="row registration-row">
        <div class="col-md-6 col-sm-8 col-xs-12 col-md-offset-3 col-sm-offset-2">
          <!-- Card style panel for registration, matching login.html UI -->
          <div class="panel panel-primary">
            <div class="panel-heading text-center">
              <h2><span class="glyphicon glyphicon-user" aria-hidden="true"></span> Registration</h2>
            </div>
            <div class="panel-body">
              <form>
                <div class="form-group">
                  <label for="name" class="control-label">Full Name</label>
                  <div class="input-group">
                    <span class="input-group-addon"><span class="glyphicon glyphicon-user"></span></span>
                    <input type="text" class="form-control input-lg" id="name" name="name" placeholder="Enter your full name" autocomplete="name" required>
                  </div>
                </div>
                <div class="form-group">
                  <label for="email" class="control-label">Email address</label>
                  <div class="input-group">
                    <span class="input-group-addon"><span class="glyphicon glyphicon-envelope"></span></span>
                    <input type="email" class="form-control input-lg" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
                  </div>
                </div>
                <div class="form-group">
                  <label for="password" class="control-label">Password</label>
                  <div class="input-group">
                    <span class="input-group-addon"><span class="glyphicon glyphicon-lock"></span></span>
                    <input type="password" class="form-control input-lg" id="password" name="password" placeholder="Enter password" autocomplete="new-password" required minlength="6">
                  </div>
                  <span class="help-block">Minimum 6 characters.</span>
                </div>
                <div class="form-group">
                  <label for="confirmPassword" class="control-label">Confirm Password</label>
                  <div class="input-group">
                    <span class="input-group-addon"><span class="glyphicon glyphicon-lock"></span></span>
                    <input type="password" class="form-control input-lg" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" autocomplete="new-password" required minlength="6">
                  </div>
                </div>
                <div class="form-group">
                  <label for="gender" class="control-label">Gender</label>
                  <select class="form-control input-lg" id="gender" name="gender" required>
                    <option value="" selected disabled>Select gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                  </select>
                </div>
                <div class="form-group">
                  <button type="submit" class="btn btn-primary btn-lg btn-block">
                    <span class="glyphicon glyphicon-ok"></span> Register
                  </button>
                </div>
              </form>
            </div>
            <div class="panel-footer text-center">
              <small>Already have an account? <a href="login.html">Login</a></small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer class="footer">
    &copy; Silver oak university
  </footer>
</body>
</html>
