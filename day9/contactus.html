<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Silver Oak University</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <!-- Added Font Awesome and Google Fonts for attractive navbar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #fff;
        color: #000;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font-family: 'Roboto', Arial, sans-serif;
      }
      main {
        flex: 1 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 0;
        width: 100vw;
        overflow: hidden;
        position: relative;
      }
      .contact-main {
        margin-top: 30px;
        margin-bottom: 30px;
        width: 100%;
      }
      .map-embed {
        border-radius: 8px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.13);
      }
      /* === Attractive Navbar Custom Styles === */
      .navbar.custom-navbar {
        background: linear-gradient(90deg, #4731d3 0%, #00c6ff 100%);
        border: none;
        padding: 0;
        box-shadow: 0 4px 24px rgba(36, 37, 38, 0.09);
        min-height: 68px;
      }
      .navbar.custom-navbar .navbar-header .navbar-brand {
        font-family: 'Roboto', Arial, sans-serif;
        font-weight: 700;
        color: #fff !important;
        font-size: 2rem;
        letter-spacing: 2px;
        text-shadow: 0 2px 8px rgba(0,0,0,0.12);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .navbar.custom-navbar .navbar-brand i {
        color: #ffe773;
      }
      .navbar.custom-navbar .nav > li > a {
        color: #fff !important;
        text-transform: uppercase;
        font-weight: 500;
        letter-spacing: 1.5px;
        transition: background 0.26s, color 0.14s;
        font-size: 1.1rem;
        border-radius: 22px;
        margin: 0 6px;
        padding: 12px 18px !important;
        position: relative;
      }
      .navbar.custom-navbar .nav > li.active > a,
      .navbar.custom-navbar .nav > li > a:hover,
      .navbar.custom-navbar .nav > li > a:focus {
        color: #373737 !important;
        background: rgba(255,255,255,0.90) !important;
        box-shadow: 0 2px 24px rgba(0,0,0,0.06);
        text-shadow: none;
      }
      .navbar.custom-navbar .navbar-toggle {
        border-color: #fff !important;
        background: rgba(255,255,255,0.2);
      }
      .navbar.custom-navbar .icon-bar {
        background-color: #fff !important;
      }
      @media (max-width: 767px) {
        .navbar.custom-navbar .navbar-header .navbar-brand {
          font-size: 1.3rem;
          gap: 5px;
        }
        .navbar.custom-navbar .nav > li > a {
          font-size: 1rem;
          text-align: left;
        }
      }
      /* End of navbar styles */
      .footer {
        background: #000;
        color: #fff;
        width: 100%;
        text-align: center;
        padding: 15px 0;
        margin-bottom: 0;
        border-radius: 0;
      }
    </style>
</head>
<body>
  <!-- More Attractive Bootstrap Navbar (Header) -->
  <nav class="navbar navbar-inverse navbar-static-top custom-navbar">
    <div class="container-fluid">
      <div class="navbar-header">
        <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>
        <a class="navbar-brand" href="home.html">
          <i class="fas fa-graduation-cap"></i> Home
        </a>
      </div>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="nav navbar-nav navbar-right">
          <li><a href="registration.html"><i class="fa fa-user-plus"></i> Registration</a></li>
          <li><a href="login.html"><i class="fa fa-sign-in-alt"></i> Login</a></li>
          <li><a href="gallery.html"><i class="fa fa-images"></i> Gallery</a></li>
          <li class="active"><a href="contactus.html"><i class="fa fa-envelope"></i> Contact Us</a></li>
          <li><a href="flexbox.html"><i class="fa fa-th-large"></i> Flexbox</a></li>

        </ul>
      </div>
    </div>
  </nav>
  <main>
    <div class="container contact-main">
      <div class="row">
        <div class="col-lg-5 col-md-5 col-sm-12">
          <div class="panel panel-default">
            <div class="panel-heading">
              <h4>Contact Details</h4>
            </div>
            <div class="panel-body">
              <p><span class="glyphicon glyphicon-envelope"></span> <strong>Email:</strong> <a href="mailto:info@silveroakuni.ac.in">info@silveroakuni.ac.in</a></p>
              <p><span class="glyphicon glyphicon-earphone"></span> <strong>Phone:</strong> +91-12345-67890</p>
              <p><span class="glyphicon glyphicon-map-marker"></span> <strong>Address:</strong><br>
                Silver Oak University, Ahmedabad,<br>
                Gujarat, India
              </p>
            </div>
          </div>
          <div class="embed-responsive embed-responsive-16by9 map-embed">
            <iframe class="embed-responsive-item"
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3675.026497134112!2d72.51128307508796!3d23.062882379138487!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x395e84fc4073a82f%3A0x8ebc3f276f4e5a27!2sSilver%20Oak%20University!5e0!3m2!1sen!2sin!4v1715353715252!5m2!1sen!2sin"
              allowfullscreen=""
              loading="lazy" referrerpolicy="no-referrer-when-downgrade"
              title="Silver Oak University Map"></iframe>
          </div>
        </div>
        <div class="col-lg-7 col-md-7 col-sm-12">
          <div class="panel panel-primary">
            <div class="panel-heading text-center">
              <h3 class="panel-title">Contact Us</h3>
            </div>
            <div class="panel-body">
              <form>
                <div class="form-group">
                  <label for="name">Name</label>
                  <input type="text" class="form-control" id="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                  <label for="email">Email</label>
                  <input type="email" class="form-control" id="email" placeholder="youremail@example.com" required>
                </div>
                <div class="form-group">
                  <label for="subject">Subject</label>
                  <input type="text" class="form-control" id="subject" placeholder="Subject" required>
                </div>
                <div class="form-group">
                  <label for="message">Message</label>
                  <textarea class="form-control" id="message" rows="5" placeholder="Type your message here..." required></textarea>
                </div>
                <div class="form-group">
                  <button type="submit" class="btn btn-primary btn-lg btn-block">Send Message</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer class="footer">
    &copy; Silver oak university
  </footer>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</body>
</html>
