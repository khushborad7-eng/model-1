<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Full Width Navbar</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
        background-color: #fff;
        color: #000;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      main {
        flex: 1 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 0;
        width: 100%;
      }
      header {
        width: 100%;
      }
      .navbar {
        background: #000 !important;
        border-radius: 0 !important;
        box-shadow: 0 2px 16px rgba(0,0,0,0.10);
        margin: 0;
        width: 100% !important;
        min-height: 64px;
        padding-top: 0;
        padding-bottom: 0;
      }
      .navbar .container-fluid {
        padding-left: 1.5rem !important;
        padding-right: 1.5rem !important;
      }
      .navbar .navbar-brand,
      .navbar .nav-link {
        color: #fff !important;
        transition: color 0.3s, background 0.3s;
        border-radius: 6px;
        padding: 0.5rem 1rem;
        margin: 0 4px;
      }
      .navbar .nav-link:hover, .navbar .navbar-brand:hover {
        background: #fff !important;
        color: #000 !important;
        text-decoration: none;
        font-weight: 600;
        box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        transform: scale(1.07);
      }
      .footer {
        background: #000;
        color: #fff;
        width: 100%;
        text-align: center;
        padding: 0.85rem 0;
        font-size: 1rem;
        border-radius: 12px 12px 0 0;
        box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
        letter-spacing: 0.5px;
      }
      .footer a {
        color: #ffc107;
        text-decoration: none;
        margin-left: 0.3rem;
      }
      .footer a:hover {
        text-decoration: underline;
        color: #fff8e1;
      }
      .carousel,
      .carousel-inner,
      .carousel-item,
      .carousel-inner img {
        width: 100vw !important;
        min-width: 100vw !important;
        left: 50%;
        right: 50%;
        transform: translateX(-50%);
      }
      .carousel-inner img {
        width: 100vw !important;
        min-width: 100vw !important;
        height: 100vh !important;
        min-height: 100vh !important;
        max-width: 100vw !important;
        max-height: 100vh !important;
        object-fit: cover;
        border-radius: 0;
        margin-bottom: 0;
        margin-top: 0;
        padding: 0;
        box-shadow: none;
        display: block;
      }
      @media (max-width: 991.98px) {
        .navbar .container-fluid {
          flex-direction: column !important;
          align-items: stretch !important;
        }
        .navbar .navbar-collapse {
          justify-content: center !important;
        }
        .carousel-inner img {
          height: 100vh !important;
          min-height: 100vh !important;
          max-height: 100vh !important;
          max-width: 100vw !important;
        }
      }
      @media (max-width: 765px) {
        .carousel-inner img {
          height: 100vh !important;
          min-height: 100vh !important;
          max-width: 100vw !important;
        }
      }
      @media (max-width: 465px) {
        .navbar .container-fluid {
          padding-left: .5rem !important;
          padding-right: .5rem !important;
        }
        .carousel-inner img {
          height: 100vh !important;
          min-height: 100vh !important;
          max-width: 100vw !important;
        }
      }
    </style>
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand" href="home.html">Home</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
          <ul class="navbar-nav mx-auto text-center">
            <li class="nav-item d-inline-block">
              <a class="nav-link" href="registration.html">Registration</a>
            </li>
            <li class="nav-item d-inline-block">
              <a class="nav-link" href="login.html">Login</a>
            </li>
            <li class="nav-item d-inline-block">
              <a class="nav-link" href="gallery.html">Gallery</a>
            </li>
            <li class="nav-item d-inline-block">
              <a class="nav-link" href="contactus.html">Contact Us</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <main class="vw-100 vh-100 m-0 p-0" style="overflow:hidden; position:relative;">
    <section id="homeCarousel" class="carousel slide vw-100 vh-100" data-bs-ride="carousel" data-bs-interval="1000" data-bs-pause="false">
      <div class="carousel-inner vw-100 vh-100">
        <div class="carousel-item active vw-100 vh-100">
          <img 
            src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80" 
            class="d-block w-100 h-100" 
            alt="Campus Image 1"
            style="object-fit:cover; min-height:100vh; min-width:100vw;"
          >
        </div>
        <div class="carousel-item vw-100 vh-100">
          <img 
            src="https://images.unsplash.com/photo-1464983953574-0892a716854b?auto=format&fit=crop&w=1920&q=80" 
            class="d-block w-100 h-100" 
            alt="Campus Image 2"
            style="object-fit:cover; min-height:100vh; min-width:100vw;"
          >
        </div>
        <div class="carousel-item vw-100 vh-100">
          <img 
            src="https://images.unsplash.com/photo-1503676382389-4809596d5290?auto=format&fit=crop&w=1920&q=80" 
            class="d-block w-100 h-100" 
            alt="Campus Image 3"
            style="object-fit:cover; min-height:100vh; min-width:100vw;"
          >
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#homeCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#homeCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#homeCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#homeCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#homeCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
      </div>
      <!-- Removed home-title text -->
    </section>
  </main>
  <footer class="footer">
    &copy; Silver oak university
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
