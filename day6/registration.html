<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
        background-color: #fff;
        color: #000;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      main {
        flex: 1 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      header {
        width: 100%;
      }
      .navbar {
        background: #000 !important;
        border-radius: 0 !important;
        box-shadow: 0 2px 16px rgba(0,0,0,0.10);
        margin: 0;
        width: 100% !important;
        min-height: 64px;
        padding-top: 0;
        padding-bottom: 0;
      }
      .navbar .container-fluid {
        padding-left: 1.5rem !important;
        padding-right: 1.5rem !important;
      }
      .navbar .navbar-brand,
      .navbar .nav-link {
        color: #fff !important;
        transition: color 0.3s, background 0.3s;
        border-radius: 6px;
        padding: 0.5rem 1rem;
        margin: 0 4px;
      }
      .navbar .nav-link:hover, .navbar .navbar-brand:hover {
        background: #fff !important;
        color: #000 !important;
        text-decoration: none;
        font-weight: 600;
        box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        transform: scale(1.07);
      }
      .footer {
        background: #000;
        color: #fff;
        width: 100%;
        text-align: center;
        padding: 0.85rem 0;
        font-size: 1rem;
        border-radius: 12px 12px 0 0;
        box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
        letter-spacing: 0.5px;
      }
      .footer a {
        color: #ffc107;
        text-decoration: none;
        margin-left: 0.3rem;
      }
      .footer a:hover {
        text-decoration: underline;
        color: #fff8e1;
      }
      @media (max-width: 991.98px) {
        .navbar .container-fluid {
          flex-direction: column !important;
          align-items: stretch !important;
        }
        .navbar .navbar-collapse {
          justify-content: center !important;
        }
      }
      @media (max-width: 465px) {
        .navbar .container-fluid {
          padding-left: .5rem !important;
          padding-right: .5rem !important;
        }
      }
    </style>
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand" href="home.html">Home</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
          <ul class="navbar-nav mx-auto text-center">
            <li class="nav-item d-inline-block">
              <a class="nav-link" href="registration.html">Registration</a>
            </li>
            <li class="nav-item d-inline-block">
              <a class="nav-link" href="login.html">Login</a>
            </li>
            <li class="nav-item d-inline-block">
              <a class="nav-link" href="gallery.html">Gallery</a>
            </li>
            <li class="nav-item d-inline-block">
              <a class="nav-link" href="contactus.html">Contact Us</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <div class="container">
      <div class="row justify-content-center mt-5 mb-5">
          <div class="col-md-6">
              <div class="card shadow-sm">
                  <div class="card-header bg-primary text-white text-center">
                      <h3>Registration Form</h3>
                  </div>
                  <div class="card-body">
                      <form>
                          <div class="mb-3">
                              <label for="name" class="form-label">Full Name</label>
                              <input type="text" class="form-control" id="name" placeholder="Enter your full name" required>
                          </div>
                          <div class="mb-3">
                              <label for="email" class="form-label">Email address</label>
                              <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                          </div>
                          <div class="mb-3">
                              <label for="password" class="form-label">Password</label>
                              <input type="password" class="form-control" id="password" placeholder="Enter password" autocomplete="new-password" required>
                          </div>
                          <div class="mb-3">
                              <label for="confirmPassword" class="form-label">Confirm Password</label>
                              <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password" required>
                          </div>
                          <div class="mb-3">
                              <label for="gender" class="form-label">Gender</label>
                              <select class="form-select" id="gender" required>
                                  <option value="" selected disabled>Select gender</option>
                                  <option>Male</option>
                                  <option>Female</option>
                                  <option>Other</option>
                              </select>
                          </div>
                          <button type="submit" class="btn btn-primary w-100">Register</button>
                      </form>
                  </div>
                  <div class="card-footer text-center">
                      <small>Already have an account? <a href="login.html">Login</a></small>
                  </div>
              </div>
          </div>
      </div>
    </div>
  </main>
  <footer class="footer">
    &copy; Silver oak university
  </footer>
  <!-- Bootstrap JS Bundle CDN (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
