<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sample Math Functions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Custom Bootstrap tweaks and visual enhancements -->
    <style>
        .card-title {
            color: #7847f5;
            font-weight: 700;
            letter-spacing: 0.03em;
        }
        .btn-primary {
            background: linear-gradient(90deg, #7142e4 0%, #458fff 100%);
            border: none;
        }
        .btn-primary:hover, .btn-primary:focus {
            background: linear-gradient(90deg, #563ab6 0%, #1766a3 100%);
        }
        #result {
            color: #17628a;
            font-size: 1.13rem;
        }
        .is-invalid {
            box-shadow: 0 0 4px 0 #dc3545;
            border-color: #dc3545;
        }
        .math-options-btns .btn {
            margin: 4px 3px;
        }
        .math-options-btns {
            margin-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: .25rem;
        }
        .math-options-btns .active {
            outline: 2px solid #6c47f5;
        }
    </style>
</head>
<body class="bg-light min-vh-100 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                <div class="card shadow-sm mt-5 mb-5">
                    <div class="card-body px-4 pb-4 pt-5">
                        <h2 class="card-title text-center mb-4">Perform Math Function</h2>
                        <div class="math-options-btns" id="mathOptionsBtns">
                            <!-- Dynamic math operation buttons will be inserted here. -->
                        </div>
                        <form id="mathForm" autocomplete="off">
                            <div class="form-group">
                                <label for="functionSelect">Choose function:</label>
                                <select id="functionSelect" class="form-control">
                                    <option value="abs">abs(x)</option>
                                    <option value="sin">sin(x)</option>
                                    <option value="cos">cos(x)</option>
                                    <option value="tan">tan(x)</option>
                                    <option value="acos">acos(x)</option>
                                    <option value="asin">asin(x)</option>
                                    <option value="atan">atan(x)</option>
                                    <option value="atan2">atan2(y, x)</option>
                                    <option value="random">random()</option>
                                    <option value="exp">exp(x)</option>
                                    <option value="ceil">ceil(x)</option>
                                    <option value="floor">floor(x)</option>
                                    <option value="log">log(x)</option>
                                    <option value="pow">pow(x, y)</option>
                                    <option value="round">round(x)</option>
                                    <option value="sqrt">sqrt(x)</option>
                                </select>
                            </div>
                            <div class="form-group" id="inputValueGroup">
                                <label for="inputValue">Enter value x:</label>
                                <input type="number" id="inputValue" class="form-control" step="any" required>
                            </div>
                            <div class="form-group d-none" id="inputValue2Group">
                                <label for="inputValue2">Enter value y:</label>
                                <input type="number" id="inputValue2" class="form-control" step="any">
                            </div>
                            <button type="submit" class="btn btn-primary btn-block mt-4">Calculate</button>
                        </form>
                        <p id="result" class="text-center mt-4"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Same functions as before
        const mathFunctions = {
            abs: x => Math.abs(x),
            sin: x => Math.sin(x),
            cos: x => Math.cos(x),
            tan: x => Math.tan(x),
            acos: x => Math.acos(x),
            asin: x => Math.asin(x),
            atan: x => Math.atan(x),
            atan2: (y, x) => Math.atan2(y, x),
            random: () => Math.random(),
            exp: x => Math.exp(x),
            ceil: x => Math.ceil(x),
            floor: x => Math.floor(x),
            log: x => Math.log(x),
            pow: (x, y) => Math.pow(x, y),
            round: x => Math.round(x),
            sqrt: x => Math.sqrt(x),
        };

        // Argument count for each function
        const functionArgTypes = {
            abs: 1,
            sin: 1,
            cos: 1,
            tan: 1,
            acos: 1,
            asin: 1,
            atan: 1,
            random: 0,
            exp: 1,
            ceil: 1,
            floor: 1,
            log: 1,
            pow: 2,
            round: 1,
            sqrt: 1,
            atan2: 2,
        };

        // To make the button bar match the select options:
        const mathOptionLabels = {
            abs: "abs(x)",
            sin: "sin(x)",
            cos: "cos(x)",
            tan: "tan(x)",
            acos: "acos(x)",
            asin: "asin(x)",
            atan: "atan(x)",
            atan2: "atan2(y, x)",
            random: "random()",
            exp: "exp(x)",
            ceil: "ceil(x)",
            floor: "floor(x)",
            log: "log(x)",
            pow: "pow(x, y)",
            round: "round(x)",
            sqrt: "sqrt(x)",
        };

        const form = document.getElementById('mathForm');
        const select = document.getElementById('functionSelect');
        const inputValueGroup = document.getElementById('inputValueGroup');
        const inputValue2Group = document.getElementById('inputValue2Group');
        const inputValue = document.getElementById('inputValue');
        const inputValue2 = document.getElementById('inputValue2');
        const resultElem = document.getElementById('result');
        const mathOptionsBtns = document.getElementById('mathOptionsBtns');

        // Generate buttons for all math options
        for (const key in mathOptionLabels) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "btn btn-outline-primary btn-sm";
            btn.textContent = mathOptionLabels[key];
            btn.dataset.func = key;
            btn.setAttribute("aria-label", mathOptionLabels[key]);
            btn.addEventListener('click', function() {
                select.value = key;
                toggleInputFields();
                // Highlight chosen
                Array.from(mathOptionsBtns.children).forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
            mathOptionsBtns.appendChild(btn);
        }

        function highlightSelectedBtn() {
            // When select changes (eg. user uses select, not button)
            const val = select.value;
            Array.from(mathOptionsBtns.children).forEach(b => {
                if (b.dataset.func === val) b.classList.add('active');
                else b.classList.remove('active');
            });
        }

        function toggleInputFields() {
            const func = select.value;
            const argCount = functionArgTypes[func] || 1;
            if (argCount === 0) {
                inputValueGroup.classList.add('d-none');
                inputValue2Group.classList.add('d-none');
                inputValue.required = false;
                inputValue2.required = false;
            } else if (argCount === 2) {
                inputValueGroup.classList.remove('d-none');
                inputValue2Group.classList.remove('d-none');
                inputValue.required = true;
                inputValue2.required = true;
            } else {
                inputValueGroup.classList.remove('d-none');
                inputValue2Group.classList.add('d-none');
                inputValue.required = true;
                inputValue2.required = false;
            }
            resultElem.textContent = "";
            highlightSelectedBtn();
        }

        // Highlight invalid fields with Bootstrap's is-invalid
        function highlightError(elem) {
            elem.classList.add('is-invalid');
            setTimeout(() => elem.classList.remove('is-invalid'), 800);
        }

        select.addEventListener('change', toggleInputFields);
        window.addEventListener('DOMContentLoaded', function() {
            toggleInputFields();
            highlightSelectedBtn();
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const funcName = select.value;
            const argCount = functionArgTypes[funcName] || 1;
            let x = parseFloat(inputValue.value);
            let y = parseFloat(inputValue2.value);
            let result, display;

            if (argCount === 0) {
                try {
                    result = mathFunctions[funcName]();
                    display = `${funcName}() = <span class="font-weight-bold text-success">${result}</span>`;
                } catch {
                    display = `<span class="text-danger">Error performing operation</span>`;
                }
            } else if (argCount === 1) {
                if (isNaN(x)) {
                    resultElem.innerHTML = `<span class="text-danger">Please enter a valid number for x.</span>`;
                    highlightError(inputValue);
                    return;
                }
                if (!(funcName in mathFunctions)) {
                    resultElem.innerHTML = `<span class="text-danger">Unknown function!</span>`;
                    return;
                }
                try {
                    result = mathFunctions[funcName](x);
                    display = `${funcName}(${x}) = <span class="font-weight-bold text-success">${result}</span>`;
                } catch {
                    display = `<span class="text-danger">Error performing operation</span>`;
                }
            } else if (argCount === 2) {
                if (isNaN(x) || isNaN(y)) {
                    resultElem.innerHTML = `<span class="text-danger">Both x and y need to be valid numbers.</span>`;
                    if (isNaN(x)) highlightError(inputValue);
                    if (isNaN(y)) highlightError(inputValue2);
                    return;
                }
                if (!(funcName in mathFunctions)) {
                    resultElem.innerHTML = `<span class="text-danger">Unknown function!</span>`;
                    return;
                }
                try {
                    result = mathFunctions[funcName](x, y);
                    display = `${funcName}(${x}, ${y}) = <span class="font-weight-bold text-success">${result}</span>`;
                } catch {
                    display = `<span class="text-danger">Error performing operation</span>`;
                }
            }
            resultElem.innerHTML = display;
        });
    </script>
</body>
</html>
