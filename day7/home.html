<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Full Width Navbar</title>
    <!-- Bootstrap 3.4.1 CSS CDN for carousel compatibility -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <style>
      body {
        background-color: #fff;
        color: #000;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      main {
        flex: 1 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 0;
        width: 100vw;
        overflow: hidden;
        position: relative;
      }
      header {
        width: 100%;
      }
      .navbar {
        background: #000 !important;
        border-radius: 0 !important;
        box-shadow: 0 2px 16px rgba(0,0,0,0.10);
        margin: 0;
        width: 100% !important;
        min-height: 64px;
        padding-top: 0;
        padding-bottom: 0;
      }
      .navbar .container-fluid {
        padding-left: 1.5rem !important;
        padding-right: 1.5rem !important;
      }
      .navbar .navbar-brand,
      .navbar .nav-link,
      .navbar .navbar-nav > li > a {
        color: #fff !important;
        transition: color 0.3s, background 0.3s;
        border-radius: 6px;
        padding: 0.5rem 1rem;
        margin: 0 4px;
      }
      .navbar .nav-link:hover, 
      .navbar .navbar-brand:hover,
      .navbar .navbar-nav > li > a:hover {
        background: #fff !important;
        color: #000 !important;
        text-decoration: none;
        font-weight: 600;
        box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        transform: scale(1.07);
      }
      .footer {
        background: #000;
        color: #fff;
        width: 100%;
        text-align: center;
        padding: 0.85rem 0;
        font-size: 1rem;
        border-radius: 12px 12px 0 0;
        box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
        letter-spacing: 0.5px;
      }
      .footer a {
        color: #ffc107;
        text-decoration: none;
        margin-left: 0.3rem;
      }
      .footer a:hover {
        text-decoration: underline;
        color: #fff8e1;
      }
      h2.text-center {
        margin: 24px 0 16px 0;
        width: 100vw;
      }
      /* Center the navbar menu items */
      .navbar .navbar-nav {
        float: none !important;
        margin: 0 auto !important;
        display: table !important;
        table-layout: fixed;
      }
      .navbar .navbar-nav > li {
        display: table-cell;
        float: none !important;
        vertical-align: middle;
        text-align: center;
      }
      @media (max-width: 991.98px) {
        .navbar .container-fluid {
          flex-direction: column !important;
          align-items: stretch !important;
        }
        .navbar .navbar-nav {
          display: block !important;
          text-align: center !important;
        }
        .navbar .navbar-nav > li {
          display: inline-block !important;
          width: auto;
        }
        .navbar .navbar-collapse {
          justify-content: center !important;
        }
      }
      @media (max-width: 465px) {
        .navbar .container-fluid {
          padding-left: .5rem !important;
          padding-right: .5rem !important;
        }
      }
    </style>
    <!-- Bootstrap 3 Carousel dependencies -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="container-fluid">
        <a class="navbar-brand" href="home.html">Home</a>
        <div class="navbar-header visible-xs">
          <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
          </button>
        </div>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="nav navbar-nav navbar-center">
            <li class="nav-item d-inline-block">
              <a class="nav-link" href="registration.html">Registration</a>
            </li>
            <li class="nav-item d-inline-block">
              <a class="nav-link" href="login.html">Login</a>
            </li>
            <li class="nav-item d-inline-block">
              <a class="nav-link" href="gallery.html">Gallery</a>
            </li>
            <li class="nav-item d-inline-block">
              <a class="nav-link" href="contactus.html">Contact Us</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <h2 class="text-center">Carousel Example</h2>
    <div id="myCarousel" class="carousel slide" data-ride="carousel">
      <!-- Indicators -->
      <ol class="carousel-indicators">
        <li data-target="#myCarousel" data-slide-to="0" class="active"></li>
        <li data-target="#myCarousel" data-slide-to="1"></li>
        <li data-target="#myCarousel" data-slide-to="2"></li>
      </ol>
      <!-- Wrapper for slides -->
      <div class="carousel-inner">
        <div class="item active">
          <img src="C:\Users\khush\OneDrive\Desktop\model 1\i1.jpg" alt="Bootstrap 1">
          <div class="carousel-caption">
            <h3>Bootstrap</h3>
            <p>The most popular front-end framework</p>
          </div>
        </div>
        <div class="item">
          <img src="C:\Users\khush\OneDrive\Desktop\model 1\i2.jpg" alt="Bootstrap 2">
          <div class="carousel-caption">
            <h3>Responsive</h3>
            <p>Looks great on all devices</p>
          </div>
        </div>
        <div class="item">
          <img src="C:\Users\khush\OneDrive\Desktop\model 1\i3.jpg" alt="Bootstrap 3">
          <div class="carousel-caption">
            <h3>Easy to Use</h3>
            <p>Quickly build modern websites</p>
          </div>
        </div>
      </div>
      <!-- Left and right controls -->
      <a class="left carousel-control" href="#myCarousel" data-slide="prev">
        <span class="glyphicon glyphicon-chevron-left"></span>
        <span class="sr-only">Previous</span>
      </a>
      <a class="right carousel-control" href="#myCarousel" data-slide="next">
        <span class="glyphicon glyphicon-chevron-right"></span>
        <span class="sr-only">Next</span>
      </a>
    </div>
  </main>
  <footer class="footer">
    &copy; Silver oak university
  </footer>
</body>
</html>
